    - id: g-use-of-force-law-and-policy
      name: Use-of-force law and policy
      level: state
      level_label: State and department
      status: in_force
      covers: When force is allowed
      falls_short: Almost none address robots directly
      sources: []
  gaps:
    - A national standard for DFR flight purposes, data retention and AI analytics (privacy is left to each city).
    - Any clear rule on whether robots may use force, outside a few cities' policies.
    - Airspace coordination when police, fire, media, delivery and hobby drones converge on one emergency.
    - Cyber and firmware standards for public safety robots, beyond country-of-origin bans.
    - Funding for small agencies to replace banned fleets and build counter-drone capacity.
    - Independent audits of how often DFR flights lead to arrests, help, or nothing.
case_studies:
  - id: c-chula-vista-ca-the-first-dfr-program
    title: The first drone-as-first-responder program
    place: Chula Vista, CA
    kind: case
    pittsburgh: false
    fields:
      - label: What was deployed, where
        text: drones launched from rooftops to 911 calls across the city, starting in 2018, the first program of its kind.
      - label: What happened (good)
        text: faster eyes on scenes, better information before officers arrive, some calls resolved without sending officers. It became the national model.
      - label: What happened (bad)
        text: the department refused to release drone video; a local newspaper sued and won access in August 2025.
      - label: Lessons
        text: Write the flight and retention policy before launch, and plan for public records requests from day one.
    sources:
      - s-investigatetv-wcax-police-drone-programs
      - s-eff-hundreds-of-dfr-programs-july-2026
    pin_id: p-chula-vista-ca
  - id: c-san-francisco-and-dallas-robots-and-leth
    title: robots and lethal force
    place: San Francisco and Dallas
    kind: case
    pittsburgh: false
    fields:
      - label: What
        text: in Dallas (2016) police strapped explosives to a bomb robot to kill a sniper who had killed five officers. In San Francisco (Nov 29, 2022) supervisors approved a policy, required under California's AB 481, allowing robots as a deadly force option in extreme cases.
      - label: What happened
        text: national backlash. A week later SF supervisors reversed and explicitly banned lethal robot use; a later vote was 10-1. SFPD said it had never used the option in 11 years. Oakland dropped a plan to arm robots with shotguns.
      - label: What changed
        text: it set the template for bans now pending in NYC (Asimov Act, 2026) and state bills. Boston Dynamics backs bans on weaponizing robots.
      - label: Lessons
        text: decide the force question in public before a crisis, not during one. The Dallas decision was made in hours with no policy.
    sources:
      - s-fortune-sf-bans-killer-robots
      - s-cbs-sf-10-1-vote
    pin_id: p-san-francisco-ca
  - id: c-la-palisades-fire-a-single-drone-grounds
    title: a single drone grounds a firefighting plane
    place: LA Palisades fire
    kind: black_swan
    pittsburgh: false
    fields:
      - label: What
        text: on Jan 9, 2025 a hobbyist launched a drone from a Santa Monica parking garage to film the fire, lost sight of it, and it hit a Quebec-owned Super Scooper.
      - label: Impact
        text: a hole in the wing; the plane, one of two Super Scoopers on the fire, was out for several days during one of the most destructive fires in California history.
      - label: Response
        text: federal charges, guilty plea, about $65K restitution.
      - label: Lessons
        text: as airspace fills with DFR, delivery and hobby drones, disasters need enforced temporary flight restrictions, detection, and now counter-drone authority. Cities should plan airspace management into emergency plans.
    sources:
      - s-us-attorney-cdca-super-scooper-drone-ple
      - s-abc7-super-scooper-details
    pin_id: p-los-angeles-ca
  - id: c-world-cup-2026-cities-get-counter-drone
    title: cities get counter-drone authority
    place: World Cup 2026
    kind: case
    pittsburgh: false
    fields:
      - label: What
        text: until December 2025, no state or local officer could legally take down a drone. The Safer Skies Act in the FY2026 defense bill changed that for trained officers protecting events and facilities.
      - label: What happened
        text: the FBI trained officers from host cities; about 60 state and local officers had authority for the tournament; DOJ and DHS issued an interim rule effective July 1, 2026 after incidents near events. Stadiums ran "zero tolerance" for drones.
      - label: Lessons
        text: authority arrived faster than the rulebook. Cities now have to decide who in their department holds this power, how it's logged, and how to avoid knocking out lawful drones or communications.
    sources:
      - s-route-fifty-ndaa-counter-drone-authority
      - s-csis-counter-drone-defense-and-the-world
      - s-bloomberg-government-doj-dhs-counter-dro
      - s-ny1-ap-zero-tolerance-for-drones-at-worl
    pin_id: p-kansas-city-mo
  - id: c-ukraine-robots-sent-in-first-to-protect
    title: robots sent in first to protect rescuers
    place: Ukraine
    kind: international
    pittsburgh: false
    fields:
      - label: What
        text: Ukraine's military ran more than 100,000 ground robot missions by August 2026, mostly logistics and evacuation. Its State Emergency Service received a Termit 2.0 ground robot in November 2026, and a Kyiv region unit uses a robot dog for demining.
      - label: Why
        text: Russian forces have attacked emergency crews more than 400 times since the full-scale invasion, killing at least 43, often with "double-tap" strikes.
      - label: Lessons
        text: the same robots move between military and civilian rescue roles. US cities are unlikely to face strikes, but the model (robot goes first into an unstable or hazardous scene) applies to building collapses, chemical spills and active shooter scenes.
    sources:
      - s-kyiv-post-state-emergency-service-termit
      - s-ukrainska-pravda-100-000-ground-robot-mi
      - s-ukrinform-robot-dog-for-sappers-in-kyiv
    pin_id: p-kyiv-region-ukraine
  - id: c-g02-singapore-xavier
    title: Patrol robot trial watches for "undesirable behaviour"
    place: Toa Payoh Central, Singapore
    kind: international
    pittsburgh: false
    pin_id: p-g02-singapore-xavier
    fields:
      - label: What happened
        text: For three weeks from Sept 5, 2021, the government's ground robot Xavier patrolled Toa Payoh Central to spot smoking in banned areas, illegal hawking and badly parked bicycles, with officers able to speak through it remotely.
      - label: Response
        text: Five agencies ran the trial. The government said the robot would not be used for enforcement during the trial.
      - label: When
        text: 2021-09
    sources: &a1
      - s-g02-singapore-xavier-1
  - id: c-g02-bogota-police-drones
    title: Police drone patrols linked to the city's command centre
    place: Bogotá, Colombia
    kind: international
    pittsburgh: false
    pin_id: p-g02-bogota-police-drones
    fields:
      - label: What happened
        text: Bogotá's metropolitan police fly drones over the city centre and other areas, linked to the C4 command centre and street cameras, mainly against street drug sales. Police reported more than 100 arrests after aerial patrols by August 2024.
      - label: Response
        text: The city bought the first five drones in 2019 and added more in 2023. Public sources found say little about privacy rules.
      - label: When
        text: 2024-08
    sources: &a2
      - s-g02-bogota-police-drones-1
      - s-g02-bogota-police-drones-2
  - id: c-g02-kyiv-sesu-robot-dog
    title: Robot dog and drones for bomb disposal and demining
    place: Kyiv region, Ukraine
    kind: international
    pittsburgh: false
    pin_id: p-g02-kyiv-sesu-robot-dog
    fields:
      - label: What happened
        text: Ukraine's State Emergency Service uses mechanized demining machines, robotic systems and drones, and a rapid response unit in the Kyiv region planned to use a robot dog to deal with explosive devices remotely.
      - label: Response
        text: Equipment came largely from EU and UNDP support, with Ukrainian companies testing new remote demining systems.
      - label: When
        text: "2024"
    sources: &a3
      - s-g02-kyiv-sesu-robot-dog-1
      - s-g02-kyiv-sesu-robot-dog-2
  - id: c-g02-massachusetts-state-police-spot
    title: State police bomb squad tests a robot dog
    place: Massachusetts, US
    kind: case
    pittsburgh: false
    pin_id: p-g02-massachusetts-state-police-spot
    fields:
      - label: What happened
        text: The Massachusetts State Police bomb squad tested Boston Dynamics' Spot as a mobile observation device for suspected bombs and dangerous scenes.
      - label: Response
        text: A state bill proposed in 2023 would ban weapons on robots; its status was not confirmed.
      - label: When
        text: "2019"
    sources: &a4
      - s-g02-massachusetts-state-police-spot-1
      - s-g02-massachusetts-state-police-spot-2
