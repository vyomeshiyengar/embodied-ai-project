  path: docs/research/sectors/02-public-safety-emergency-response.md
  drive_url: https://docs.google.com/document/d/1aapitkXeKiX1hdyL_eoKe1-USt-rfz4gryXNgcEfS-Q/edit
liable_to_change: FAA Part 108 (final rule under White House review, statutory deadline Dec 7, 2026), FCC Covered List exemptions for drones (current ones run through the end of 2026), the NYC "Asimov Act," and state rules on police drones.
one_liner: a drone network turns a once-rare police tool into an always-on one, so the policy matters more than the hardware.
overview:
  summary: widespread for drones, early for ground robots, and growing fastest in autonomy.
  points:
    - 'Drones are already normal police and fire equipment. About 1,500 US law enforcement agencies have some drone program. The big shift is "Drone as First Responder" (DFR): drones parked in docks around the city that launch automatically on a 911 call and get there before officers. Chula Vista, CA started it in 2018.'
    - DFR exploded after April 2025, when the FAA streamlined the waiver needed to fly beyond the pilot's line of sight. The FAA issued 976 such waivers from 2018 to April 2025, then more than that in the following ten months. By February 2026 over 1,000 public safety agencies held one.
    - Ground robots are older but less common. Bomb squad robots have existed for decades. Robot dogs (Boston Dynamics Spot and cheaper Chinese models) and firefighting robots (LAFD's Thermite RS3) are spreading but still rare.
    - Cities can now shoot back. Since the FY2026 defense bill (Dec 2025), trained state and local police can take down threatening drones. That authority was first used at the 2026 World Cup.
    - War zones are the leading edge. Ukraine runs tens of thousands of ground robot missions a month, and its State Emergency Service now uses ground robots to reach rescue sites hit by "double-tap" strikes.
  why_it_matters: this is the sector where the city itself is the operator, so the city owns the risk. The two hardest questions are civil liberties (drones and robots as permanent eyes in the sky and on the street) and use of force (whether a robot can ever hurt someone). It is also the sector most exposed to national security supply chain rules, since most public safety drones were made by DJI in China.
  core_shift: a police helicopter was expensive, loud and rare. A drone network is cheap, quiet and always on. The same tool that finds a missing child in minutes can, with a policy change, watch a whole neighborhood all day.
