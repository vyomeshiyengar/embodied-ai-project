scenarios:
  - horizon: 1
    label: 1 year (2027)
    best: Part 108 published; DFR programs adopt public flight logs and short retention as the norm
    worst: A DFR drone falls on a crowd or a video leak exposes a domestic violence victim's home
    surprise: FCC restricts older foreign drones; half of small agencies are grounded
    city_action: Pass a drone use and retention policy through council; publish flight logs; inventory fleet country of origin and plan replacements
  - horizon: 5
    label: 5 years (2031)
    best: Robot-first entry into hazardous scenes cuts firefighter and officer injuries; AED drones save lives
    worst: Always-on AI drone coverage of poor neighborhoods; trust collapses; lawsuits
    surprise: A hostile drone attack at a US event changes airspace rules overnight
    city_action: Adopt a surveillance technology ordinance; ban armed robots by policy; build a regional counter-drone and airspace plan
  - horizon: 10
    label: 10 years (2036)
    best: Shared regional drone networks serve police, fire, EMS and public works under one public governance board
    worst: Armed autonomous robots normalized after a high-profile police death
    surprise: Federal government takes over drone policing standards and preempts local limits
    city_action: Write the force question into law now; create community oversight with real power; pool resources with nearby towns
