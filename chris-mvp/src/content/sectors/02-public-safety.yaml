terms:
  - term: DFR (Drone as First Responder)
    definition: drones launched from docks to a 911 call, flown remotely, often with AI auto-routing.
    sources: []
  - term: Drone-in-a-box / dock
    definition: a weatherproof station on a rooftop where the drone lives, charges and launches by itself.
    sources: []
  - term: VLOS / BVLOS
    definition: visual line of sight (pilot can see it) vs. beyond visual line of sight. BVLOS is what makes DFR possible and needs FAA permission.
    sources: []
  - term: Part 107
    definition: "the FAA's basic small drone rules. Part 91 public aircraft operations + COA/waiver: how government agencies fly beyond normal limits. Part 108: the pending rule for routine BVLOS flights."
    sources: []
  - term: Remote ID
    definition: a broadcast "license plate" every drone must send so police can identify it.
    sources: []
  - term: Counter-UAS (C-UAS)
    definition: "tools to detect, track and stop drones: radio detection, jamming, taking control of the drone, nets or kinetic takedown."
    sources: []
  - term: Blue UAS
    definition: the Defense Department's list of approved, mostly US- or ally-made drones. Now the main exemption from the FCC ban on new foreign drones.
    sources: []
  - term: Covered List (FCC)
    definition: list of equipment that can't get FCC approval, so new models can't be imported or sold. All new foreign-made drones were added in Dec 2025.
    sources: []
  - term: UGV (unmanned ground vehicle)
    definition: any ground robot, from a bomb robot to a robot dog to a firefighting tank.
    sources: []
  - term: Quadruped / robot dog
    definition: four-legged robot that climbs stairs and rubble. Used for scouting dangerous rooms.
    sources: []
  - term: Teleoperated vs. autonomous
    definition: most public safety robots are still driven by a person. Autonomy is creeping in through auto-flight, auto-tracking and AI object detection.
    sources: []
  - term: Computer vision analytics
    definition: AI that recognizes people, cars, license plates or weapons in drone video. This is where drones turn into surveillance systems.
    sources: []
  - term: Use-of-force policy
    definition: rules on when police can use force. The open question is whether robots can ever be a "force option."
    sources: []
  - term: CCOPS / surveillance technology ordinance
    definition: local laws (ACLU model) that make police get council approval and publish use policies before buying surveillance tech. California's AB 481 does this for "military equipment," including robots.
    sources: []
  - term: Double-tap strike
    definition: attacking the same place twice to hit rescuers. The reason Ukraine sends robots in first.
    sources: []
