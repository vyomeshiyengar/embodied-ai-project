      name: Safer Skies Act (FY2026 NDAA) + DOJ/DHS interim rule (July 1, 2026)
      level: federal
      level_label: Federal
      status: in_force
      covers: First legal authority for trained state and local police to detect and take down threatening drones
      falls_short: Authority came before full rules; few trained officers; risk of disrupting lawful drones and comms
      sources:
        - s-route-fifty-ndaa-counter-drone-authority
        - s-bloomberg-government-doj-dhs-counter-dro
    - id: g-fcc-covered-list-dec-22-2025
      name: FCC Covered List (Dec 22, 2025)
      level: federal
      level_label: Federal
      status: in_force
      covers: Bans new foreign-made drone models and components; existing ones still usable; Blue UAS exemptions
      falls_short: Agencies face higher costs and fewer models; possible future retroactive limits; DJI appealing in the 9th Circuit
      sources:
        - s-dronexl-fcc-bans-foreign-drones
        - s-simpson-thacher-fcc-covered-list-excepti
        - s-fcc-july-21-2026-announcement
    - id: g-american-security-drone-act-2023
      name: American Security Drone Act (2023)
      level: federal
      level_label: Federal
      status: in_force
      covers: Limits federal purchase and federal funding of drones from covered foreign companies
      falls_short: Pushes grant-funded local agencies off Chinese drones; no privacy content
      sources: []
    - id: g-fourth-amendment-case-law-e-g-leaders-of
      name: Fourth Amendment case law (e.g., Leaders of a Beautiful Struggle v. Baltimore, 4th Cir. 2021)
      level: federal
      level_label: Federal courts
      status: in_force
      covers: Persistent aerial surveillance of a city can be an unconstitutional search
      falls_short: Few rulings on DFR; standards vary by circuit
      sources: []
    - id: g-state-drone-surveillance-laws-e-g-florid
      name: State drone surveillance laws (e.g., Florida's Freedom from Unwarranted Surveillance Act; Texas Gov't Code ch. 423)
      level: state
      level_label: State
      status: in_force
      covers: When police need warrants, allowed exceptions, image rules
      falls_short: Patchwork; many exceptions; written before DFR
      sources: []
    - id: g-state-bans-on-government-use-of-chinese
      name: State bans on government use of Chinese drones (e.g., Florida 2023)
      level: state
      level_label: State
      status: in_force
      covers: Approved-manufacturer lists
      falls_short: Forced costly fleet replacements
      sources: []
      unconfirmed:
        - Florida's 2023 ban on government use of Chinese drones
    - id: g-california-ab-481-military-equipment-use
      name: California AB 481 (military equipment use policies)
      level: city
      level_label: State, applied locally
      status: in_force
      covers: Police must get council approval and publish policies for robots and similar equipment
      falls_short: Led to SF's 2022 lethal-robot fight; only CA
      sources:
        - s-fortune-sf-bans-killer-robots
    - id: g-local-surveillance-ordinances-ccops-mode
      name: Local surveillance ordinances (CCOPS model; NYC POST Act 2020; Oakland, Seattle)
      level: city
      level_label: City
      status: in_force
      covers: Impact reports, use policies, annual reporting before using surveillance tech
      falls_short: Only some cities; enforcement weak; disclosure is not control
      sources: []
    - id: g-armed-robot-bills-nyc-int-871-2026-asimo
      name: 'Armed robot bills: NYC Int. 871-2026 "Asimov Act"; NY State A399; Massachusetts bill (passed House)'
      level: city
      level_label: City / State, pending
      status: pending
      covers: Ban robots armed with weapons or used to cause injury
      falls_short: Not law yet in most places; NY state bill doesn't cover police
      sources:
