  - id: t-ai-powered-robots-and-machines-autom
    name: AI-powered robots and machines (Automated recycling sorting systems)
    zone: park
    where: Train stations, neighborhoods, commercial campus, business parks
    how: I-powered robots and machines equipped with sensors, cameras, and machine learning algorithms can identify, sort, and separate different types of waste materials more accurately and rapidly than manual sorting There is a self-driving robot named HARR-E which prevents the need to drag bins to the curb. HARR-E uses AI to navigate from your location to the central collection point, picking up refuse and recycling on your schedule.
    uses: Powered Robots that can sort through trash and dispose waste in appropriate bins
    running_in: null
    city_response: null
    progression: null
    sources: []
  - id: t-ai-driven-automation-system-self-dri
    name: AI-driven automation system/self driving waste trucks
    zone: street
    where: In neighborhoods
    how: It uses cameras and sensors (including light detection and ranging technology) to identify the exact location of trash carts on the curb, then automatically controls the truck’s robotic arm to grab and dump the carts – all with the push of a button. normally do. It speeds up the collection cycle at each stop. It also enhances safety across an entire fleet. Autonomous garbage trucks use LiDAR, computer vision, and real-time mapping to navigate collection routes without human drivers, reducing labor costs, eliminating driver fatigue risk, and enabling 24/7 collection scheduling in low-traffic overnight windows. AI fleet management platforms monitor vehicle position, fill capacity, battery or fuel levels, and maintenance status in real time, automatically rerouting units when obstacles or mechanical issues are detected mid-route.
    uses: They are used for picking up trash from the bins. It alleviates truck drivers from having to find the trash bin, and manually lifting the bin to put trash into the truck
