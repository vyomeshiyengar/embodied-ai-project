    name: Bin Bot (Autonomous roaming trash bin)
    zone: street
    where: Train stations;
    how: These bin-bots contain systems that can measure the amount of waste in their compartments and will automatically transport the waste to the station bin collection centre. When the compartment is full robots can identify when a passenger has waste to dispose of and can travel to that person to enable disposal.
    uses: Mobile robot bins that can move through a defined area within the station, to detect waste on the floor and people wanting to dispose of waste
