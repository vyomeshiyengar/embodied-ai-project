overview:
  summary: "Currently, physical AI is already operating at commercial scale in this space. The governance questions that are important happen in three instances: where delivery robots use shared public space for private commercial trips (sidewalks, curb ramps, bike lanes, low airspace), where state law limits what cities can do, and where robots cross paths with emergency response."
