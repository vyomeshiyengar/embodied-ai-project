regulations:
  rules:
    - id: g-state-pdd-laws-30-states-e-g-pennsylvani
      name: State PDD laws (30+ states; e.g., Pennsylvania Act 106 of 2020, Virginia, Florida, Tennessee 2026)
      level: state
      level_label: State
      status: in_force
      covers: Size, weight, speed, where robots may operate, insurance, yield-to-pedestrians rules
      falls_short: Limits vary widely (Washington's 120-lb cap vs. Pennsylvania's 550 lb); many restrict local bans; few require incident reporting or accessibility standards
      sources: []
    - id: g-city-sidewalk-and-right-of-way-ordinance
      name: City sidewalk & right-of-way ordinances and pilot permits (e.g., San Francisco 2017; Chicago PDD pilot 2022)
      level: city
      level_label: City (where states allow)
      status: in_force
      covers: San Francisco capped robots at 9 citywide, 3 mph, industrial areas, with human chaperones; Chicago runs a pilot overseen by its consumer protection and transportation departments
      falls_short: Pilots often lack public metrics; complaint data sits with 311, not the permit
      sources: []
    - id: g-outright-local-bans-toronto-2021-ottawa
      name: Outright local bans (Toronto 2021; Ottawa)
      level: city
      level_label: City
      status: in_force
      covers: Toronto bans robots on sidewalks and cycle tracks pending provincial rules
      falls_short: Protects access but leaves no path to a safe, regulated version
      sources: []
    - id: g-nhtsa-vehicle-safety-standards-and-exemp
      name: NHTSA vehicle safety standards & exemptions
      level: federal
      level_label: Federal
      status: in_force
      covers: Road vehicles; Nuro's R2 got the first exemption for a vehicle with no human controls, with reporting duties
      falls_short: Sidewalk robots fall outside; exemptions are case-by-case
      sources: []
    - id: g-state-av-laws-and-dmv-permits
      name: State AV laws & DMV permits
      level: state
      level_label: State
      status: in_force
      covers: Road-going autonomous vehicles
      falls_short: Hybrid robots that switch between sidewalk, bike lane and road fall between PDD and AV rules
      sources: []
    - id: g-faa-rules-part-107-waivers-part-108-bvlo
      name: FAA rules (Part 107 waivers; Part 108 BVLOS pending)
      level: federal
      level_label: Federal
      status: pending
      covers: Drone certification, operations, routes
      falls_short: Cities can't regulate flight paths or noise; Part 108 still at White House review as of Nov 2026; Texas bars city drone ordinances
      sources: []
    - id: g-city-zoning-for-drone-hubs
      name: City zoning for drone hubs
      level: city
      level_label: City
      status: in_force
      covers: Where nests and launch pads can go
      falls_short: Hard to revisit after approval (Richardson, TX)
      sources: []
    - id: g-ada-title-ii-and-iii
      name: ADA Title II & III
      level: federal
      level_label: Federal
      status: in_force
      covers: Accessible public right-of-way and services
      falls_short: No technical rule keeping robots out of curb ramps or setting minimum clear sidewalk width with robots present
      sources: []
    - id: g-tort-and-product-liability
      name: Tort & product liability
      level: state
      level_label: State
      status: in_force
      covers: Injury claims
      falls_short: Liability split across platform, robot maker, merchant and remote operator; robots may not stop or identify themselves after a crash
      sources: []
    - id: g-labor-and-employment-law-incl-app-based
      name: Labor & employment law (incl. app-based worker pay rules)
      level: city
      level_label: State / City
      status: in_force
      covers: Courier pay and conditions
      falls_short: Doesn't address robot substitution or remote-operator working conditions
      sources: []
    - id: g-privacy-law-state-consumer-privacy-wiret
      name: Privacy law (state consumer privacy, wiretap and biometric laws)
      level: state
      level_label: State
      status: in_force
      covers: Data collection and use
      falls_short: Continuous public-space video is lightly regulated; no rules on footage retention or police access
      sources: []
    - id: g-china-s-low-altitude-economy-policy-and
      name: China's low-altitude economy policy & Shenzhen regulations
      level: city
      level_label: National / City (China)
      status: in_force
      covers: Dedicated drone corridors, landing sites, operator training
      falls_short: "A comparison point: cities plan the airspace as infrastructure rather than reacting to it"
      sources: []
  gaps:
    - "Incident reporting: no US rule requires sidewalk-robot operators to report collisions or near-misses publicly."
    - "Stop-and-identify duty: nothing requires a robot to stop after contact and display who operates it."
    - "Accessibility standards: there's no rule for robots at curb ramps, for clear sidewalk width, or for crosswalk behavior."
    - "Responder override: there's no standard that lets police, fire or EMS stop or move a robot at a scene."
    - "Hybrid robots: robots that move between sidewalks, bike lanes and roads fall between PDD and AV laws."
    - "Density and curb management: there are no caps tied to sidewalk width or pedestrian volume, and no fees for commercial use of public sidewalks."
    - "Data rules: nothing governs retention, police access or AI training for footage collected in public."
    - "Labor transition: there's no plan for couriers and remote operators as fleets grow."
case_studies:
  - id: c-g05-shenzhen-meituan-drones
    title: Food delivery drones over city parks
    place: Lianhua Hill Park, Shenzhen, China
    kind: international
    pittsburgh: false
    pin_id: p-g05-shenzhen-meituan-drones
    fields:
      - label: What happened
        text: Meituan drones deliver food to pickup kiosks in Shenzhen, including routes opened in 2024 in Central Park, Shenzhen Bay Park and Lianhua Hill Park. By the end of 2024 the company reported 53 routes and more than 400,000 deliveries across Chinese cities.
      - label: Response
        text: China's aviation regulator granted Meituan the country's first nationwide drone delivery licence in April 2025. Deliveries in parts of Shenzhen were paused at the regulator's request during the November 2026 APEC summit.
      - label: When
        text: 2024-07
    sources: &a1
      - s-g05-shenzhen-meituan-drones-1
      - s-g05-shenzhen-meituan-drones-2
  - id: c-g05-tokyo-nihonbashi-robots
    title: Sidewalk delivery robots under Japan's new road rules
    place: Nihonbashi, Tokyo, Japan
    kind: international
    pittsburgh: false
    pin_id: p-g05-tokyo-nihonbashi-robots
    fields:
      - label: What happened
        text: Uber Eats began robot food deliveries in central Tokyo with Cartken robots supervised by Mitsubishi Electric staff, starting in a small area around Nihonbashi on weekdays.
      - label: Response
        text: Revised traffic rules from April 2023 let remotely monitored delivery robots use sidewalks across Japan as a type of sidewalk vehicle.
      - label: When
        text: 2024-03
    sources: &a2
      - s-g05-tokyo-nihonbashi-robots-1
      - s-g05-tokyo-nihonbashi-robots-2
