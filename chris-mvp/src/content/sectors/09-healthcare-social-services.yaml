regulations:
  rules:
    - id: g-fda-medical-device-law-fd-and-c-act-510
      name: "FDA medical device law (FD&C Act: 510(k), De Novo, PMA; MAUDE reporting; premarket cybersecurity rules)"
      level: federal
      level_label: Federal
      status: in_force
      covers: Surgical robots, devices that diagnose or treat; adverse-event reporting
      falls_short: Logistics, telepresence and most companion robots are not "devices." Fleet-learning models change after clearance. MAUDE relies on voluntary, often incomplete reports.
      sources: []
    - id: g-fda-general-wellness-policy-revised-jan
      name: FDA General Wellness policy (revised Jan 2026)
      level: federal
      level_label: Federal
      status: in_force
      covers: Excludes low-risk products that promote healthy habits from device rules
      falls_short: A companion that reminds about pills, tracks routines and alerts family can sit outside FDA review if it avoids disease claims
      sources: []
    - id: g-hipaa-privacy-and-security-rules
      name: HIPAA Privacy & Security Rules
      level: federal
      level_label: Federal (HHS)
      status: in_force
      covers: Health data held by providers, insurers and their business associates
      falls_short: Does not cover data on consumer devices or many agency-distributed companions
      sources: []
    - id: g-ftc-act-5-health-breach-notification-rul
      name: FTC Act §5 + Health Breach Notification Rule (amended 2024)
      level: federal
      level_label: Federal
      status: in_force
      covers: Deceptive practices; breach notice for non-HIPAA health apps and connected devices
      falls_short: Notice after a breach, not limits on collection; enforcement only after harm
      sources: []
    - id: g-state-ai-in-mental-health-laws-illinois
      name: State AI-in-mental-health laws (Illinois WOPR Act 2025; Nevada; Utah disclosure law)
      level: state
      level_label: State
      status: in_force
      covers: Illinois bans AI therapy and AI that detects emotions or mental states without licensed oversight; fines up to $10,000 per use
      falls_short: Wellness apps are carved out; unclear whether an embodied companion that "checks in" on mood is covered; a Dec 2025 federal executive order targets state AI laws for litigation
      sources: []
    - id: g-state-health-data-privacy-laws-e-g-washi
      name: State health-data privacy laws (e.g., Washington's My Health My Data Act)
      level: state
      level_label: State
      status: in_force
      covers: Consent for consumer health data outside HIPAA
      falls_short: Patchwork; most states have none
      sources: []
    - id: g-faa-part-107-waivers-part-108-bvlos
      name: FAA Part 107 waivers → Part 108 (BVLOS)
      level: federal
      level_label: Federal
      status: in_force
      covers: Drone certification, operations, routes; Part 108 would standardize beyond-line-of-sight flights
      falls_short: Final rule still at White House review as of Nov 2026; statutory deadline Dec 7, 2026. Cities cannot regulate flight paths, noise or altitude.
      sources: []
    - id: g-state-drone-preemption-e-g-texas-gov-t-c
      name: State drone preemption (e.g., Texas Gov't Code 423.009)
      level: state
      level_label: State
      status: in_force
      covers: Bars city ordinances on drone operation
      falls_short: Leaves cities with only land-use control of hubs
      sources: []
    - id: g-city-zoning-for-drone-hubs
      name: City zoning for drone hubs
      level: city
      level_label: City
      status: in_force
      covers: Where nests and launch pads can go (Plano created a new land-use category in 2024)
      falls_short: Once zoning is granted, cities found it legally risky to revoke (Richardson, 2026)
      sources: []
    - id: g-state-av-laws-dmv-utility-commission-per
      name: State AV laws + DMV/utility commission permits
      level: state
      level_label: State
      status: in_force
      covers: Testing and deployment of robotaxis and delivery AVs
      falls_short: Cities like San Francisco could not directly limit fleets; no binding standard for yielding to emergency vehicles
      sources: []
    - id: g-state-personal-delivery-device-laws-city
      name: State personal-delivery-device laws + city right-of-way permits
      level: city
      level_label: State / City
      status: in_force
      covers: Sidewalk robot weight, speed, operating areas; city permit conditions
      falls_short: Rarely require curb-cut or accessible-route rules; Pittsburgh required community meetings but not technical accessibility standards
      sources: []
    - id: g-americans-with-disabilities-act
      name: Americans with Disabilities Act
      level: federal
      level_label: Federal (enforced via complaints, DOJ)
      status: in_force
      covers: Accessible public right-of-way and facilities
      falls_short: No standard for robots that obstruct accessible routes; relief comes after the fact
      sources: []
    - id: g-product-liability-state-tort-law
      name: Product liability (state tort law)
      level: state
      level_label: State
      status: in_force
      covers: Defective design, manufacturing, warnings
      falls_short: Hard to assign fault across hardware maker, AI model, hospital, network carrier and integrator; learning systems blur "defect"
      sources: []
    - id: g-osha-general-duty-clause-voluntary-iso-1
      name: OSHA (General Duty Clause; voluntary ISO 13482 for personal care robots)
      level: voluntary
      level_label: Federal / state plans
      status: in_force
      covers: Worker safety around equipment
      falls_short: No OSHA standard for mobile service robots sharing corridors with staff
      sources: []
    - id: g-professional-licensure-medical-and-nursi
      name: Professional licensure (medical and nursing boards)
      level: state
      level_label: State
      status: in_force
      covers: Who may diagnose, treat, deliver care
      falls_short: No rule on what must be said in person (e.g., end-of-life news)
      sources: []
    - id: g-public-funding-programs-older-americans
      name: Public funding programs (Older Americans Act, state aging budgets, Medicaid waivers)
      level: federal
      level_label: Federal / State / County
      status: in_force
      covers: Who pays for in-home support
      falls_short: No outcome, consent or data standards attached when funds buy robots; NY's results are self-reported
      sources: []
    - id: g-eu-ai-act-medical-device-regulation-mach
      name: EU AI Act + Medical Device Regulation + Machinery Regulation
      level: international
      level_label: EU
      status: in_force
      covers: AI-enabled medical devices are "high-risk"; Machinery Regulation applies from Jan 2027; device AI rules from Aug 2028
      falls_short: Legal scholars argue neither the MDR nor the AI Act adequately covers care robots and companions
      sources: []
  gaps:
    - "Non-device care robots: logistics and companion robots get no premarket safety or efficacy review."
    - "Home health data: conversations and routines captured by companions often fall outside HIPAA."
    - "Emergency override: there’s no standard lets paramedics, firefighters or police move or stop a robot, drone or AV on scene."
    - "Accessibility in the right-of-way: no technical rule keeps robots out of curb cuts, ramps or accessible routes."
    - "Fleet-update governance: outside FDA devices, there’s no requirement for staged rollouts, kill switches, or public incident reporting."
    - "Human-in-the-loop for sensitive moments: nothing says which conversations (a terminal diagnosis, a child-welfare visit) must happen in person."
    - "Public procurement terms: when agencies buy robots for residents, no standard covers consent, data ownership, independent evaluation, or vendor-exit plans."
    - "City voice in preempted domains: cities absorb noise, blocked streets and emergency delays but cannot set drone or AV operating rules."
case_studies:
  - id: c-g09-rwanda-zipline
    title: A national drone delivery service for blood
    place: Muhanga, Rwanda
    kind: international
    pittsburgh: false
    pin_id: p-g09-rwanda-zipline
    fields:
      - label: What happened
        text: Rwanda launched a national drone delivery service with Zipline on Oct 14, 2016, flying blood from a hub in Muhanga to clinics that order by text message.
      - label: Response
        text: The service grew to cover almost the whole country. A 2026 report found it helps, but only so much, as health needs go beyond delivery.
      - label: When
        text: 2016-10
    sources: &a1
      - s-g09-rwanda-zipline-1
      - s-g09-rwanda-zipline-2
  - id: c-g09-kenya-zipline
    title: Medical drone deliveries under national drone rules
    place: Kisumu, Kenya
    kind: international
    pittsburgh: false
    pin_id: p-g09-kenya-zipline
    fields:
      - label: What happened
        text: Zipline opened its first Kenyan hub in Kisumu County in 2022 for on-demand deliveries of blood, vaccines and other medical supplies, later serving four counties in the Lake region.
      - label: Response
        text: Drones in Kenya fall under the Civil Aviation (Unmanned Aircraft Systems) Regulations, 2020. Operators say some approvals are still slow.
      - label: When
        text: 2022-02
    sources: &a2
      - s-g09-kenya-zipline-1
      - s-g09-kenya-zipline-2
