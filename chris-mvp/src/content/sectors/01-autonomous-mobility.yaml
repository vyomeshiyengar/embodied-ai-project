      name: NHTSA AV Framework (Apr 2025) and July 2026 package
      level: federal
      level_label: Federal
      status: in_force
      covers: Faster exemptions for vehicles without manual controls (Zoox got the first, July 30, 2026); interim rule letting already-built vehicles qualify; streamlined crash reporting; planned ADS performance standards
      falls_short: No minimum "driving test" for the software yet; exemptions rely on company data; AV STEP oversight program was withdrawn
