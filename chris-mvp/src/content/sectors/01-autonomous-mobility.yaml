terms:
  - term: Sensors
    definition: cameras, LiDAR (laser 3D scanning), radar and microphones. Waymo uses all of them. Tesla uses cameras only.
    sources: []
  - term: Perception
    definition: AI that turns sensor data into "that is a child, that is a school bus with its stop arm out."
    sources: []
  - term: Prediction and planning
    definition: the "driver" software that guesses what others will do and picks a path.
    sources: []
  - term: End-to-end driving models
    definition: newer systems that learn driving from huge amounts of video in one large neural network instead of hand-written rules. Easier to scale, harder to explain after a crash.
    sources: []
  - term: World models
    definition: AI that learns how the physical world behaves and can simulate it. Used to generate rare scenarios (a kid running out from behind a van) for training and testing.
    sources: []
  - term: Vision-language(-action) models
    definition: models that connect what a camera sees to language and actions, so a car can "read" a hand-written detour sign or a police officer's gestures.
    sources: []
  - term: HD maps
    definition: detailed maps of each lane, curb and signal that most robotaxis depend on. This is why services launch city by city.
    sources: []
  - term: Remote assistance
    definition: humans in a control center who answer the car's questions when it is stuck ("can I go around this?"). They do not usually steer. Waymo has about 70 agents on duty for about 3,000 robotaxis, some based in the Philippines.
    sources: []
  - term: Remote driving / teleoperation
    definition: a human actually drives the car from far away. Tesla has disclosed crashes while teleoperators were driving.
    sources: []
  - term: SAE Levels 0 to 5
    definition: the industry scale for automation. Level 2 = driver assistance, the human is still driving (Tesla FSD for consumers). Level 4 = no driver needed inside a defined area and conditions (Waymo). Level 5 = anywhere, any conditions (does not exist).
    sources: []
  - term: ADS
    definition: automated driving system, the regulatory term for the Level 3 to 5 "driver" software.
    sources: []
  - term: ODD (operational design domain)
    definition: "where and when the system is allowed to drive: which streets, speeds, weather, times. Most local rules work by shrinking or expanding the ODD."
    sources: []
  - term: Geofence
    definition: a digital boundary the vehicle will not cross. Austin expects operators to keep cars 1,000 ft from emergencies.
    sources: []
  - term: Minimal risk condition / fallback
    definition: what the car does when it cannot continue, usually stopping. The trouble is that "stop" in the wrong place blocks fire trucks.
    sources: []
  - term: Safety driver / safety monitor
    definition: a human inside the vehicle who can take over.
    sources: []
  - term: Disengagement
    definition: when the system hands control back to a human.
    sources: []
  - term: FMVSS
    definition: federal vehicle safety standards, written assuming a steering wheel and pedals. Vehicles without them need an exemption (Part 555).
    sources: []
  - term: SGO (Standing General Order)
    definition: NHTSA's rule that operators report crashes. The main public crash data source.
    sources: []
  - term: Recall (software)
    definition: a fix pushed over the air to the whole fleet. Waymo's school bus recall covered 3,067 vehicles.
    sources: []
  - term: First Responder Interaction Plan (FRIP)
    definition: a document explaining how police and fire can stop, move and access a vehicle. Required in Texas.
    sources: []
  - term: Notice of AV noncompliance
    definition: California's version of a traffic ticket for a car with no driver, sent to the company.
    sources: []
  - term: Preemption
    definition: a higher level of government blocking a lower one from making its own rules.
    sources: []
