  gaps:
    - A minimum performance "driving test" for the software before it gets public streets (NHTSA says it's coming).
    - "Rules on remote assistance: where operators sit, how many cars each one watches, training, and response times."
    - "Fleet-level emergency rules: what happens when the whole fleet must stop or clear roads, and who can order it."
    - City access to incident data and video in a standard format.
    - Penalties that mean something to a company (a $200 ticket doesn't).
    - Notice to cities before fleet-wide software updates.
    - Evacuation and disaster duties for fleets.
    - Labor transition support for drivers.
case_studies:
  - id: c-austin-texas-the-working-group-model
    title: The working group model
    place: Austin, TX
    kind: case
    pittsburgh: false
    fields:
      - label: What was deployed, where
        text: Waymo (fully driverless, via Uber) and Tesla robotaxis across central Austin.
      - label: What happened (good)
        text: the city's Citywide AV Working Group runs repeated trainings for police and fire, documents incidents, and gives operators maps of fire stations, school zones and valet zones. It's treated as a national best practice. The city publishes an incident dashboard (75 incidents logged in 2026 by mid-year, including one collision, eight near misses and seven cases of ignoring police direction).
      - label: What happened (bad)
        text: Austin ISD logged about 20 illegal school bus passes in fall 2025, some after Waymo said it had fixed the problem. Tesla's fleet reported 14 crashes in its first 8 months with all details redacted.
      - label: How the city responded
        text: working group and dashboard (soft power), school district letters and stop-arm camera evidence to NHTSA, two seats on the state's AV advisory committee. It cannot license or ban operators because Texas preempts it.
      - label: What changed
        text: a federal investigation, a software recall of 3,067 vehicles, and Texas's first real authorization system (May 2026).
      - label: Lessons
        text: put middle managers and first-responder trainers in the room, not executives. Collect your own data, because operators won't share video. School districts are key partners. A preempted city can still shape outcomes through evidence.
    sources:
      - s-city-of-austin-av-dashboard
      - s-cbs-austin-sb-2807-and-austin-dashboard
      - s-kxan-nhtsa-probing-waymo-recall
      - s-cbs-waymo-recalls-3-000-vehicles
      - s-cbs-tesla-14-crashes-in-austin
      - s-txdmv-av-program-sb-2807
    pin_id: p-austin-tx
  - id: c-san-francisco-the-blackout-stall
    title: the blackout stall
    place: San Francisco
    kind: black_swan
    pittsburgh: false
    fields:
      - label: What was deployed, where
        text: about 1,000 Waymo robotaxis citywide.
      - label: What happened
        text: on Dec 20, 2025 a substation fire knocked out power to about 130,000 PG&E customers. Traffic signals went dark. Waymos treated dark signals cautiously and waited for remote confirmation, but cell networks were overloaded, so many sat in intersections. Waymo suspended service until the next day. No injuries reported.
      - label: How the city responded
        text: city officials coordinated with Waymo during the outage; the state DMV met with the city afterward. Waymo pushed fleet-wide updates in January 2026 to handle region-wide outages.
      - label: Lessons
        text: fleets depend on the same grid and cell networks that fail in disasters. Cities should ask operators for a written "region-wide outage" plan and test it in drills. This is the clearest US example of a correlated failure.
    sources:
      - s-axios-sf-power-outage
      - s-fast-company-why-waymo-went-down
      - s-wardsauto-waymo-fleet-wide-update-after
    pin_id: p-san-francisco-ca
  - id: c-wuhan-china-fleet-freeze-at-scale
    title: fleet freeze at scale
    place: Wuhan, China
    kind: black_swan
    pittsburgh: false
    fields:
      - label: What was deployed, where
        text: more than 1,000 Baidu Apollo Go driverless cars, China's largest single-city robotaxi fleet.
      - label: What happened
        text: on the evening of Mar 31, 2026, more than 100 cars stopped mid-traffic at the same time, some on elevated ring roads. Riders couldn't reach customer service, which said it could only look into individual car numbers. Police attributed it to a system failure.
      - label: How the government responded
        text: investigation, and a national pause on new robotaxi licenses (reported late April 2026). This followed a car falling into a construction pit in Chongqing (2025) and a crash that led Zhuzhou to suspend operations.
      - label: Lessons
        text: the risk to plan for is not one bad car, it's hundreds failing together. Cities need a fleet-level emergency contact (not a customer service line) and a right to order a fleet-wide stand-down or recovery.
    sources:
      - s-the-next-web-wuhan-fleet-freeze
      - s-semafor-china-slows-robotaxi-rollout
      - s-carnewschina-wuhan-stranding
    pin_id: p-wuhan-china
  - id: c-jacksonville-florida-robotaxi-tech-insid
    title: robotaxi tech inside public transit
    place: Jacksonville, Florida
    kind: case
    pittsburgh: false
    fields:
      - label: What was deployed, where
        text: NAVI autonomous shuttles (9 seats, ADA accessible) on a 3.5-mile downtown corridor, run by the Jacksonville Transportation Authority, launched June 30, 2025.
      - label: What happened
        text: more than 15,200 riders and 61,000 autonomous miles in year one. Holon is building a shuttle factory in the city.
      - label: How the city responded
        text: it owns the service. JTA is now exploring expansion to the Beaches and retrofitting regular buses.
      - label: Lessons
        text: when the public agency is the operator, it controls data, accessibility and routes. Ridership is modest, so the case for scaling still has to be made. Good contrast to private robotaxis.
    sources:
      - s-sustainable-bus-navi-first-year
    pin_id: p-jacksonville-fl
  - id: c-from-testing-capital-to-a-city-with-no-v
    title: "Pittsburgh: from testing capital to a city with no veto"
    place: Pittsburgh, PA
    kind: case
    pittsburgh: true
    fields:
      - label: What
        text: Pittsburgh hosted Uber, Argo AI, Aurora and Motional testing in the late 2010s. Waymo began testing in Dec 2025 and got PennDOT certification to test autonomously with a specialist behind the wheel in early 2026.
      - label: How the city responded
        text: Pittsburgh's Shared + Autonomous Mobility Principles and DOMI's Emerging Tech Roundtable with other cities. But Act 130 (2022) moved authority to PennDOT. PennDOT is building PennSTART, a $20 million test track that will also train first responders.
      - label: Lessons
        text: "what Pittsburgh does that others don't: a university-industry base and a state test track for first responders. What it lacks: city authority. Its tools are principles, roundtables and data asks."
    sources:
      - s-axios-pittsburgh-waymo-expands-push
      - s-city-of-pittsburgh-autonomous-technology
      - s-axios-pittsburgh-pennstart
    pin_id: p-pittsburgh-pa
