recommendation_candidate: 'a shared cross-city "fleet emergency protocol" that every operator must sign before entering any member city: a 24/7 fleet-level contact, the right to order a geofenced stand-down, outage and evacuation behavior, and incident data in a common format. Pittsburgh could pilot it through the Bloomberg network even without state authority, because operators want to be in many cities.'
