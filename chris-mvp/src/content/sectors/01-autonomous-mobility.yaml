liable_to_change: Waymo's city list, the status of the SELF DRIVE Act and BUILD America 250 Act in Congress, NHTSA's planned ADS performance standards, the DC Council bill, and China's pause on new robotaxi licenses.
one_liner: one software system drives the whole fleet, so it fails together.
overview:
  summary: early commercial deployment, scaling fast in a handful of metros.
  points:
    - Robotaxis are a real commercial service, not a pilot. Waymo opened public rides in Dallas, Houston, San Antonio and Orlando in February 2026, bringing it to 10 US metros, and added Tampa, San Diego and Denver in September 2026 for 14 cities with public riders. It says it will pass 1 million paid trips a week by the end of 2026.
    - Competitors are behind but moving. Tesla has run a robotaxi service in Austin since June 2025. Zoox (Amazon) runs paid rides in Las Vegas in a purpose-built vehicle with no steering wheel, including an airport route.
    - Driverless freight is live on Texas highways. Pittsburgh-based Aurora runs driverless trucks between Dallas and Houston and Fort Worth and El Paso, and expects more than 200 driverless trucks by the end of 2026.
    - Public transit is starting. Jacksonville's NAVI shuttle is the first autonomous service running inside a US public transit system.
    - Outside the US, China (Baidu Apollo Go, Pony.ai, WeRide) and the Gulf (Dubai, Abu Dhabi) are the other scale markets. Tokyo and London are in supervised testing.
  why_it_matters: "robotaxis change who is responsible on the street. There is no driver to ticket, question or direct. Cities feel this first through police and fire interactions, curb space, school zones, special events, labor fights and incident data they do not control. Most states have already taken authority away from cities (Texas, Pennsylvania, California), so a city's main levers are operational: maps, training, working groups, curb rules, data asks and public pressure."
  core_shift: "a human driver is one person making one mistake. A robotaxi fleet is one software system driving thousands of cars. That makes the average trip safer (the evidence so far points that way for Waymo) but creates a new failure type: the whole fleet can fail at once, in the same way, at the same time."
