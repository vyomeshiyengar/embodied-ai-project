      covers: Police can issue "notices of AV noncompliance" to the company; company must report within 72 hours (24 for serious); dedicated emergency phone line; local emergency officials can order temporary "do not enter" zones; repeat notices can lead to permit suspension; new heavy-duty truck permits
      falls_short: No fines attached to notices; cities still can't license robotaxis themselves (CPUC and DMV do)
