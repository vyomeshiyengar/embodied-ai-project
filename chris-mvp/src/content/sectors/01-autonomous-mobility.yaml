scenarios:
  - horizon: 1
    label: 1 year (2027)
    best: Robotaxis in 20+ US cities with standard first-responder plans; NHTSA publishes a draft ADS performance standard
    worst: A robotaxi kills a child near a school; national backlash; patchwork bans
    surprise: Federal preemption passes inside a transportation bill and voids city and state rules overnight
    city_action: Start a working group before launch; sign data and emergency contact agreements; map school zones, fire stations and event zones for operators
  - horizon: 5
    label: 5 years (2031)
    best: Robotaxis cut serious crashes in served areas; transit agencies run autonomous shuttles that fill coverage gaps; drivers retrained
    worst: Empty-mile congestion, transit ridership falls, curb chaos; a fleet-wide freeze during a hurricane evacuation
    surprise: "Remote assistance becomes the bottleneck: a cyberattack on an overseas ops center grounds fleets in several cities"
    city_action: Price curbs and empty miles; require outage and evacuation plans; ask for onshore or audited remote ops; build a shared incident database with peer cities
  - horizon: 10
    label: 10 years (2036)
    best: Most ride-hail and much freight is autonomous; parking lots redeveloped; traffic deaths drop sharply
    worst: Two or three companies control city mobility; cities dependent with no leverage; job losses concentrated in immigrant communities
    surprise: Car ownership collapses faster than expected and gas tax and parking revenue disappear, creating a budget crisis
    city_action: Plan revenue replacement (per-mile fees); keep public transit as the backbone; negotiate public data rights early
