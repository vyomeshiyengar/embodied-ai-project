regulations:
  rules:
    - id: g-air-monitoring-and-standards-us-clean-ai
      name: US Clean Air Act and EPA monitoring rules (40 CFR Part 58); EU Ambient Air Quality Directive (2008/50/EC, revised in 2024)
      area: Air monitoring and standards
      level: federal
      level_label: Federal/EU with state or national environment agencies
      status: in_force
      covers: Official measurement methods, networks and limit values
      falls_short: Rules favour fixed reference stations; mobile and low-cost sensor data is not regulatory-grade; no standard for drone-based measurement
      sources: []
    - id: g-water-us-clean-water-act-including-npdes
      name: US Clean Water Act (including NPDES discharge permits) and Safe Drinking Water Act; EU Water Framework Directive
      area: Water
      level: federal
      level_label: Federal/EU with states and utilities
      status: in_force
      covers: Water-quality standards and discharge permits
      falls_short: Little guidance on using autonomous vessels or AI as evidence of violations
      sources: []
    - id: g-drone-aviation-us-faa-part-107-and-bvlos
      name: US FAA Part 107 and BVLOS waivers; EU Regulations 2019/947 and 2019/945; UK CAA rules; China's UAV flight management rules (2024); Japan's Level 4 flights
      area: Drone aviation
      level: federal
      level_label: National aviation authorities; cities limited to their own sites
      status: in_force
      covers: Pilot certification, flying zones, flights over people
      falls_short: BVLOS and fleet operations still need case-by-case approval; emergency airspace coordination is weak
      sources: []
    - id: g-parks-wildlife-and-habitat-us-endangered
      name: US Endangered Species Act and Marine Mammal Protection Act; National Park Service drone restrictions; EU Birds and Habitats Directives
      area: Parks, wildlife and habitat
      level: federal
      level_label: Federal and state wildlife and park agencies
      status: in_force
      covers: Protection of species and protected land, bans on harassment
      falls_short: Do not set out wildlife-aware flight or vessel standards for robots
      sources: []
    - id: g-maritime-and-waterways-colregs-collision
      name: COLREGs (collision rules at sea); US Rivers and Harbors Act; UK Maritime Autonomous Surface Ship guidance; International Maritime Organization autonomous-ship rules (in development)
      area: Maritime and waterways
      level: international
      level_label: National maritime authorities, port authorities, coast guards
      status: in_force
      covers: Navigation duties, lights, lookout requirements
      falls_short: Written for crewed ships; unclear for small unmanned craft in city waterways
      sources: []
    - id: g-privacy-and-search-rules-us-fourth-amend
      name: US Fourth Amendment case law (e.g., Kyllo v. United States on thermal imaging; Florida v. Riley on aerial observation); state drone-privacy laws; GDPR; China's Personal Information Protection Law and Data Security Law
      area: Privacy and search rules
      level: federal
      level_label: State and federal courts; national data authorities
      status: in_force
      covers: Government sensing of private property and personal data
      falls_short: Courts and laws did not anticipate persistent, high-resolution environmental scanning; rules differ widely
      sources: []
    - id: g-geospatial-and-data-law-china-s-surveyin
      name: China's Surveying and Mapping Law; EU INSPIRE and Environmental Information Directive (2003/4/EC); US FOIA and state open-data laws
      area: Geospatial and data law
      level: city
      level_label: National, with city open-data policies
      status: in_force
      covers: Who may collect and share map data; public access to environmental information
      falls_short: Open-data duties can clash with security and privacy limits; mapping restrictions can limit citizen science
      sources: []
    - id: g-environmental-review-and-permits-us-nepa
      name: US NEPA and state equivalents; local permits for work in rivers, parks and shorelines
      area: Environmental review and permits
      level: federal
      level_label: Federal, state, city
      status: in_force
      covers: Review of projects with environmental impact
      falls_short: Rarely applied to monitoring fleets, though they may disturb habitats
      sources: []
    - id: g-workplace-safety-osha-rules-including-ha
      name: OSHA rules (including hazardous-atmosphere rules); EU Machinery Regulation (EU) 2023/1230; ATEX rules for explosive atmospheres
      area: Workplace safety
      level: federal
      level_label: Federal/EU, national and state agencies
      status: in_force
      covers: Worker safety and equipment standards
      falls_short: Do not address human-robot field teams or algorithm-set workloads
      sources: []
    - id: g-product-liability-and-insurance-state-pr
      name: State product-liability law; EU Product Liability Directive (revised); drone insurance rules
      area: Product liability and insurance
      level: state
      level_label: State / national
      status: in_force
      covers: Responsibility for harm from robots
      falls_short: Unclear who is liable when AI misreads data and a decision causes harm
      sources: []
    - id: g-ai-and-cyber-eu-ai-act-may-classify-some
      name: EU AI Act (may classify some systems as high-risk, e.g., safety components of critical infrastructure); NIS2; US sector rules and state AI laws
      area: AI and cyber
      level: federal
      level_label: EU/national; federal and state in the US
      status: in_force
      covers: Risk management, transparency, human oversight, security
      falls_short: Environmental monitoring is not clearly named; timelines for high-risk rules have been shifting
      sources: []
  gaps:
    - Limits on surveillance, retention and secondary use of high-resolution environmental data.
    - Wildlife and habitat standards for drones and vessels.
    - Shared airspace and waterway rules during disasters.
    - Liability and appeal rights when automated environmental alerts cause harm.
    - Equity requirements for where monitoring is deployed.
    - Cyber-integrity requirements for sensor networks that trigger public safety actions.
case_studies:
  - id: c-g07-jakarta-interceptor
    title: A solar-powered river trash interceptor
    place: Cengkareng Drain, Jakarta, Indonesia
    kind: international
    pittsburgh: false
    pin_id: p-g07-jakarta-interceptor
    fields:
      - label: What happened
        text: The Ocean Cleanup's first Interceptor, an automated solar-powered barge, collected floating plastic near the mouth of Jakarta's Cengkareng Drain from 2019.
      - label: Response
        text: Indonesia and the Netherlands endorsed further deployments. Independent reporters found it stalled after heavy rain in early 2020.
      - label: When
        text: "2019"
    sources: &a1
      - s-g07-jakarta-interceptor-1
      - s-g07-jakarta-interceptor-2
