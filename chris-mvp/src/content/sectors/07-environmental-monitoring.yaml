overview:
  summary: Most environmental monitoring is still done by fixed stations, satellites and human field crews.
  points:
    - "Embodied AI adds mobile sensing: drones, ground rovers, surface and underwater vehicles, and sensor-equipped vehicles that reach places stations cannot and fill gaps between them."
    - Drones with air and thermal sensors, and unmanned boats for lakes, rivers and coasts, are in early commercial use.
    - Wildfire detection and response, methane leak finding and river-trash interceptors are the most developed city-facing uses.
    - Swarms, long-duration autonomous vessels and robots that sample soil and water without a human are mostly pilots or research.
    - Data from low-cost mobile sensors is usually not regulatory-grade, so it supports screening and enforcement leads rather than official compliance decisions.
  why_it_matters: "Cities are legally and politically accountable for air, water, heat, flood and fire risk, but have too few measurements at neighborhood level. Mobile robots can map pollution block by block, find illegal discharges, track floods and fires as they move, and enter places too dangerous for people (radiation, toxic plumes, flooded areas). They also raise new issues: surveillance of private land, data that can trigger enforcement or property-value effects, wildlife disturbance, airspace and waterway conflicts, and unequal coverage of neighborhoods."
  core_shift: null
