terms:
  - term: UAS / UAV / drone
    definition: "unmanned aircraft. Drone-in-a-box: a drone that lives in a weatherproof station and launches on its own."
    sources: []
  - term: USV / ASV
    definition: "unmanned or autonomous surface vessel. AUV: autonomous underwater vehicle. Glider: a long-range underwater vehicle that moves by changing buoyancy."
    sources: []
  - term: Rover / UGV
    definition: unmanned ground vehicle.
    sources: []
  - term: Interceptor
    definition: a floating, solar-powered device that captures river debris.
    sources: []
  - term: Swarm
    definition: many robots coordinating on one task.
    sources: []
  - term: Mobile sensing platform
    definition: any vehicle (including buses and refuse trucks) that carries sensors as it moves.
    sources: []
  - term: PM2.5 / PM10
    definition: particles smaller than 2.5 or 10 micrometers; key air-pollution measures.
    sources: []
  - term: NO2, O3, VOCs
    definition: nitrogen dioxide, ozone, volatile organic compounds.
    sources: []
  - term: Low-cost sensor
    definition: inexpensive sensor that is useful for mapping but less accurate than a regulatory instrument.
    sources: []
  - term: Reference monitor / FRM / FEM
    definition: official, regulatory-grade equipment and approved methods.
    sources: []
  - term: Calibration and drift
    definition: correcting a sensor against a known reference; drift is the gradual loss of accuracy.
    sources: []
  - term: OGI
    definition: optical gas imaging; cameras that show invisible gas leaks.
    sources: []
  - term: Multispectral / hyperspectral / thermal
    definition: imaging in many wavelengths used for vegetation, water quality and heat.
    sources: []
  - term: eDNA
    definition: environmental DNA; traces of genetic material used to detect species in water or soil.
    sources: []
  - term: Bioacoustics
    definition: monitoring wildlife by sound.
    sources: []
  - term: LiDAR
    definition: laser scanning used for terrain, flood and canopy models.
    sources: []
  - term: VLOS / BVLOS
    definition: visual line of sight / beyond visual line of sight; BVLOS is the key legal step for routine autonomous monitoring.
    sources: []
  - term: Remote ID
    definition: "a broadcast 'digital license plate' for drones. Geofence: a software boundary that keeps robots out of an area."
    sources: []
  - term: AIS
    definition: automatic identification system, a transponder used by ships and used on autonomous vessels.
    sources: []
  - term: Persistent autonomy
    definition: robots that stay deployed for days or months.
    sources: []
  - term: Human-in-the-loop / on-the-loop
    definition: a person approves decisions / monitors and can intervene.
    sources: []
  - term: Edge AI
    definition: processing on the robot instead of in the cloud.
    sources: []
  - term: Sensor fusion
    definition: combining data from several sensors, satellites and stations.
    sources: []
  - term: Digital twin
    definition: a live digital model of a river basin, city or forest that is updated by sensor data.
    sources: []
  - term: Source apportionment
    definition: working out which sources (traffic, industry, fires) cause the pollution.
    sources: []
  - term: Regulatory-grade vs screening-grade data
    definition: whether data can be used for legal decisions or only for indication.
    sources: []
  - term: Environmental justice
    definition: the principle that pollution burdens should not fall unfairly on certain communities.
    sources: []
  - term: Wildland-urban interface (WUI)
    definition: where homes meet fire-prone vegetation.
    sources: []
  - term: NPDES
    definition: US permit system for pollutant discharge into water.
    sources: []
  - term: Incidental data
    definition: information captured by accident, such as people in an aerial image.
    sources: []
  - term: Citizen science
    definition: public participation in data collection.
    sources: []
  - term: Dual use
    definition: technology that can serve both civilian and hostile purposes.
    sources: []
  - term: Black swan
    definition: a rare, severe event that is hard to predict.
    sources: []
