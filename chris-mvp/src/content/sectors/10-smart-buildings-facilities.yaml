scenarios:
  - horizon: 1
    label: 1 year (2027)
    best: Cities adopt a shared robot procurement addendum (data, security, emergency behavior); pilots like PIT publish results
    worst: A cheap imported robot in a city building is found sending video abroad
    surprise: Federal ban on adversary-made robots extended to grant-funded local purchases
    city_action: Inventory every robot and connected device in city buildings; add telemetry and security clauses to contracts
  - horizon: 5
    label: 5 years (2031)
    best: New public buildings are "robot-ready" with standard lift and door interfaces; robots handle night cleaning and hazardous inspection; workers moved to supervision roles
    worst: A fire evacuation is slowed by robots in stairwells or lifts; lawsuits follow
    surprise: Humanoids get good fast and vendors offer them below janitor wages, triggering union fights
    city_action: Write a robot fire and outage standard with the fire marshal; bargain with unions early; prefer open standards like SS 713
  - horizon: 10
    label: 10 years (2036)
    best: District-level platforms (city-run) coordinate robots across public buildings with strong privacy rules
    worst: A wormable exploit takes over robots across many cities' buildings at once
    surprise: Robots become so capable at using human interfaces that building integration platforms become obsolete
    city_action: Keep fallback staffing plans; avoid single-vendor lock-in; require security updates and code escrow
