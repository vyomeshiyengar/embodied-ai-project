id: "10"
slug: smart-buildings-facilities
name: Smart Buildings & Municipal Facilities
short_name: Buildings
owner: Chris
status: full
as_of: 2026-11-23
source_doc:
  path: docs/research/sectors/10-smart-buildings-municipal-facilities.md
  drive_url: https://docs.google.com/document/d/14GAwGFwVJ4wwD4-7dAqJDdALW1mWIW-WLfDugYiOGCU/edit
liable_to_change: the American Security Robotics Act and other limits on Chinese robots, Punggol's robotics testbed launch, Pittsburgh airport's six-month robot pilot results, and China's humanoid push.
one_liner: a robot in a city building is a moving camera and computer that needs your doors and lifts, so you set the rules when you sign the contract.
overview:
  summary: widespread for floor cleaning, early deployment for security and inspection, pilots for humanoids and multi-robot buildings.
  points:
    - Cleaning robots are routine. Autonomous floor scrubbers run in airports, malls, hospitals and some public buildings. Pittsburgh International Airport was the first US airport to use autonomous UV cleaning robots (2020, with Pittsburgh's Carnegie Robotics).
    - Security robots are common in private property, rare in government. Knightscope robots patrol parking lots, campuses and some city sites. The NYPD's Times Square subway robot pilot (2023) was dropped after a few months.
    - Robot dogs are moving indoors. Pittsburgh's airport began a six-month pilot with Skild AI quadrupeds in fall 2026 to monitor air quality and flag spills and full trash bins.
    - Humanoids are just arriving. A Singapore facility firm began deploying Unitree G1 humanoids for cleaning and maintenance in June 2026. China wants 10,000+ humanoids in commercial use by the end of 2026, mostly bought by government and state firms.
    - The real action is the building, not just the robot. Singapore and South Korea now set standards so robots from different makers can ride lifts and open doors. Singapore's Punggol Digital District connects 23 building systems on one platform and is launching a public multi-operator robot testbed.
  why_it_matters: "cities own a lot of buildings and pay a lot for cleaning, security and maintenance, so vendors will pitch robots as cost savings. But a robot inside a city building is a mobile camera, microphone and computer in places with sensitive data (police records, court files, voter rolls, children in libraries). Procurement is the main lever, and it is where cities are least prepared: few have standards for robot data, cybersecurity, accessibility, labor impact or emergency behavior."
  core_shift: robots stop being equipment and start being "tenants" of the building. They need doors, lifts, Wi-Fi, chargers and permission to move. Whoever controls that integration (the building owner, the vendor or the city) controls the robots.
players:
  - type: Cleaning robots
    who: Brain Corp (software in Tennant, Nilfisk machines), Avidbots, Carnegie Robotics (Pittsburgh), Gausium, Pudu, LionsBot (Singapore)
  - type: Security robots
