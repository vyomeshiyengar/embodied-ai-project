  - type: Building integration
    who: Lift makers (KONE, Otis, Schindler, TK Elevator), door makers, Open Robotics (Open-RMF), JTC and GovTech Singapore (Open Digital Platform), Siemens, Honeywell
  - type: Government actors
    who: City facilities and general services departments, airport authorities, CIOs and CISOs, OSHA and state OSHA plans, procurement offices; Singapore JTC, IMDA and Enterprise Singapore; Korea's Ministry of Trade, Industry and Energy
  - type: Labor and civil society
    who: SEIU (janitors and building service workers), AFSCME (public employees), privacy and disability advocates
terms:
  - term: AMR (autonomous mobile robot)
    definition: a robot that drives itself around a building using sensors and a map, as opposed to following tape or rails.
    sources: []
  - term: ASR (autonomous security robot)
    definition: industry term for patrol robots with cameras, alarms and sometimes license plate readers.
    sources: []
  - term: Quadruped
    definition: four-legged robot ("robot dog") that can handle stairs and uneven floors.
    sources: []
  - term: Humanoid
    definition: robot shaped like a person so it can use human spaces and tools (door handles, buttons, mops). Still unreliable outside demos.
    sources: []
  - term: Robot-lift integration
    definition: software link that lets a robot call an elevator, ride it and get off on the right floor. Singapore's standard for this is SS 713.
    sources: []
  - term: Fleet manager / middleware (e.g., Open-RMF)
    definition: software that coordinates robots from different makers so they don't block each other at doors and lifts.
    sources: []
  - term: Digital twin
    definition: a live 3D model of the building that robots use to navigate and that managers use to see where everything is.
    sources: []
  - term: BMS (building management system)
    definition: the system that runs HVAC, lights, access control and alarms. Robots increasingly connect to it.
    sources: []
  - term: Robot-as-a-Service (RaaS)
    definition: leasing robots with maintenance and software included, the usual model for cities. Knightscope calls it Machine-as-a-Service.
    sources: []
  - term: Keep-out zone
    definition: an area mapped as off-limits for the robot (Pittsburgh airport's pilot uses them).
    sources: []
  - term: Telemetry
    definition: "data the robot sends back to its maker: location, camera, audio, status. Where it goes matters."
    sources: []
  - term: OT (operational technology) security
    definition: cybersecurity for physical systems like lifts and doors, different from office IT.
    sources: []
  - term: Fire service mode / elevator recall
    definition: what lifts and doors do in a fire. Robots need to know too.
    sources: []
  - term: Embodied AI training data
    definition: recordings of humans doing tasks so robots can learn them. Some operators pay cleaners to wear sensors.
    sources: []
