regulations:
  rules:
    - id: g-osha-general-duty-clause-osha-robotics-g
      name: OSHA general duty clause + OSHA robotics guidance
      level: federal
      level_label: Federal / state plans
      status: in_force
      covers: Employers must keep workplaces free of serious hazards
      falls_short: No specific standard for mobile or humanoid robots in public buildings
      sources: []
    - id: g-ansi-a3-r15-08-parts-1-to-3-industrial-m
      name: ANSI/A3 R15.08 Parts 1 to 3 (industrial mobile robots; Part 3 published 2026)
      level: voluntary
      level_label: Voluntary US standard
      status: in_force
      covers: Design, integration and safe use of mobile robots, including user risk assessments
      falls_short: Written for industrial settings, not lobbies with the public
      sources:
        - s-ansi-r15-08-3-2026
    - id: g-iso-13482-personal-care-robots-ul-3300-s
      name: ISO 13482 (personal care robots), UL 3300 (service robots), ISO 25785-1 (legged robots, draft)
      level: voluntary
      level_label: Voluntary international / US
      status: pending
      covers: Safety of robots near people
      falls_short: Voluntary; legged and humanoid robots not fully covered yet
      sources: []
    - id: g-singapore-ss-713-2025-replaced-tr-93-202
      name: Singapore SS 713:2025 (replaced TR 93:2021)
      level: voluntary
      level_label: National standard (Singapore)
      status: in_force
      covers: Data exchange between robots, lifts and automatic doors, including fire evacuation and power outages
      falls_short: No US equivalent; ASME elevator code doesn't address robot riders
      sources:
        - s-singapore-standards-ss-713-2025
    - id: g-korean-industrial-standards-for-indoor-d
      name: Korean Industrial Standards for indoor delivery robots and elevators
      level: international
      level_label: National (Korea)
      status: in_force
      covers: Safety and evaluation for robots using elevators
      falls_short: Korea only
      sources:
        - s-elevator-world-korea-delivery-robot-elev
    - id: g-american-security-robotics-act-cotton-an
      name: American Security Robotics Act (Cotton and Schumer, introduced Mar 26, 2026) and NDAA humanoid limits
      level: federal
      level_label: Federal, pending / military only
      status: pending
      covers: Would bar federal agencies from buying or using ground robots from foreign adversaries
      falls_short: Covers federal, not cities; but a signal for grant-funded local purchases
      sources:
        - s-fdd-senate-robot-procurement-ban
        - s-interesting-engineering-ndaa-military-hu
    - id: g-ndaa-section-889-covered-telecom-and-vid
      name: NDAA Section 889 (covered telecom and video equipment)
      level: federal
      level_label: Federal
      status: in_force
      covers: Bans certain Chinese cameras and telecom gear in federal contracts
      falls_short: Doesn't name robots; robots may contain covered parts
      sources: []
    - id: g-state-privacy-and-biometric-laws-illinoi
      name: State privacy and biometric laws (Illinois BIPA, CCPA, others)
      level: state
      level_label: State
      status: in_force
      covers: Face and voice data, consent, retention
      falls_short: Government agencies often exempt
      sources: []
    - id: g-state-wiretap-and-recording-laws-e-g-pen
      name: State wiretap and recording laws (e.g., Pennsylvania all-party consent)
      level: state
      level_label: State
      status: in_force
      covers: Recording conversations
      falls_short: Robots with microphones may break these without anyone noticing
      sources: []
    - id: g-public-records-laws
      name: Public records laws
      level: state
      level_label: State
      status: in_force
      covers: Robot video and logs may be public records
      falls_short: Hard to redact at scale; vendor-held data
      sources: []
    - id: g-fire-and-building-codes-nfpa-ibc-and-ada
      name: Fire and building codes (NFPA, IBC) and ADA
      level: city
      level_label: State / local adoption
      status: in_force
      covers: Egress, accessible routes, elevators
      falls_short: Silent on robots in egress paths and accessible routes
      sources: []
    - id: g-city-procurement-templates-e-g-govai-coa
      name: City procurement templates (e.g., GovAI Coalition)
      level: city
      level_label: City
      status: in_force
      covers: AI vendor terms, fact sheets, incident plans
      falls_short: Software-focused; no physical safety or robot telemetry clauses
      sources: []
    - id: g-eu-machinery-regulation-2023-1230-applie
      name: EU Machinery Regulation 2023/1230 (applies from 2027) and EU AI Act
      level: international
      level_label: EU
      status: in_force
      covers: Machine safety including AI-driven behavior; high-risk AI rules
      falls_short: EU only; timelines shifting
      sources: []
  gaps:
    - A US standard for how robots behave in fires, outages and evacuations.
    - "Procurement clauses for robot telemetry: what data leaves the building, where it's stored, who can access it remotely."
    - Security certification for robots before they join a city network.
    - Rules on robots in accessible routes and lifts during busy hours.
    - Labor transition and consultation rules when robots replace cleaning or security contracts.
    - Rules on using workers to collect robot training data.
case_studies:
  - id: c-punggol-digital-district-singapore-the-c
    title: The city builds the robot operating system
    place: Punggol Digital District, Singapore
    kind: case
    pittsburgh: false
    fields:
      - label: What was deployed, where
        text: a government-built Open Digital Platform (JTC and GovTech) linking 23 systems (lifts, chargers, CCTV, district cooling, building management) in a 50-hectare district, with an operational playbook covering charging points, movement speeds, coordinate mapping, APIs and lift use. A living robotics testbed with eight industry partners (IMDA, JTC, Singapore Institute of Technology) launches later in 2026.
      - label: What happened (good)
        text: robot companies don't have to build every integration themselves; the platform is part of the district's offer to tenants.
      - label: Lessons
        text: interest is not adoption. Match requirements to what a robot does and where. Question whether every robot must be tracked centrally.
    sources:
      - s-jtc-open-digital-platform
      - s-jtc-government-and-eight-partners-to-tes
      - s-eweek-punggol-robot-testbed
    pin_id: p-punggol-digital-district-singapo
  - id: c-naver-1784-korea-designing-the-building
    title: designing the building for robots
    place: Naver 1784, Korea
    kind: case
    pittsburgh: false
    fields:
      - label: What
        text: Naver's 36-floor second headquarters (completed 2022), billed as the first robot-friendly building. Delivery robots ride a robot-only elevator ("Roboport") and share a cloud "brain" instead of each carrying expensive computers.
      - label: What happened
        text: robots deliver coffee and packages across floors. Designers found small things matter, like where the robot stands in a lift so people feel comfortable. In 2026 Naver exported a version to Tokyo Midtown Yaesu that works without robot-only lifts.
      - label: How the government responded
        text: Korea wrote national standards for indoor delivery robots and elevator use.
      - label: Lessons
        text: following wheelchair accessibility standards also made the building work for robots. Standards for lifts and doors are what let robots from different makers share a building, the same move Singapore made with SS 713.
    sources:
      - s-freethink-naver-1784
      - s-asia-economy-naver-exports-1784-tech-to
      - s-elevator-world-korea-delivery-robot-elev
    pin_id: p-naver-1784-seongnam-korea
  - id: c-pittsburgh-international-airport-pilotin
    title: piloting with guardrails
    place: Pittsburgh International Airport
    kind: international
    pittsburgh: true
    fields:
      - label: What
        text: in 2020 PIT became the first US airport with autonomous UV cleaning robots (Nilfisk machines with Pittsburgh's Carnegie Robotics). In fall 2026, through its xBridge innovation program, it began a six-month pilot with up to four Skild AI robot dogs and two chargers in the Airside Terminal.
      - label: How it's set up
        text: each robot has a defined area and keep-out zones; Skild handles mapping, supervision and monitoring and trains airport staff; robots stop when someone blocks their path. First task is indoor air quality, later spills and full trash bins.
      - label: Lessons
        text: "a public authority can test with clear scope, time limit and vendor supervision. This is a model a city could copy for its own buildings, and it shows Pittsburgh's advantage: local robotics firms testing in local public facilities."
    sources:
      - s-cbs-pittsburgh-pit-uv-cleaning-robots-20
      - s-robotics-tomorrow-pit-and-skild-ai
      - s-future-travel-experience-pit-robot-pilot
      - s-technical-ly-six-month-pit-pilot
    pin_id: p-pittsburgh-international-airport
  - id: c-nypd-s-k5-subway-robot-the-pilot-that-di
    title: the pilot that didn't stick
    place: NYPD's K5 subway robot
    kind: case
    pittsburgh: false
    fields:
      - label: What
        text: a 400-pound Knightscope K5 leased to patrol the Times Square subway station overnight in 2023 for about $12,250 for the whole contract.
      - label: What happened
        text: officers had to escort it (to prevent vandalism), riders said it was usually plugged in, and it was retired after the pilot. A year later the city still had no use for it.
      - label: Lessons
        text: set success measures before launch; a robot that needs human guards doesn't save labor; public-facing security robots draw strong reactions. Good "what not to do" case.
    sources:
      - s-engadget-nypd-ends-k5-trial
      - s-amny-k5-still-unused
    pin_id: p-times-square-station-new-york
  - id: c-humanoids-for-facility-management-yy-gro
    title: YY Group and China's push
    place: Humanoids for facility management
    kind: case
    pittsburgh: false
    fields:
      - label: What
        text: in June 2026 Singapore's YY Group began deploying Unitree G1 humanoids for cleaning and maintenance in commercial buildings. China is pushing to put over 10,000 humanoids into commercial use by end of 2026.
      - label: What happened
        text: reporting finds demand so far is mostly created by government purchases and subsidies, and the robots still struggle outside staged demos. The same Unitree models had a serious wireless security flaw and send telemetry to China.
      - label: Lessons
        text: for cities, humanoids are a "watch, don't buy yet" item. If they arrive, the procurement questions (data, security, labor) matter more than the robot's abilities.
    sources:
      - s-tech-times-yy-group-humanoids
      - s-caixin-china-10-000-humanoids-target
      - s-khaleej-times-bloomberg-humanoid-demand
      - s-help-net-security-g1-data-to-china
  - id: c-g10-changi-cleaning-robots
    title: Autonomous floor cleaners across airport terminals
    place: Changi Airport, Singapore
    kind: international
    pittsburgh: false
    pin_id: p-g10-changi-cleaning-robots
    fields:
      - label: What happened
        text: Changi Airport started with 11 autonomous cleaning robots in Terminals 3 and 4 in 2017 to raise cleaners' productivity, with plans for 32 units across all terminals.
      - label: Response
        text: A 2025 university study looked at how the robots changed cleaning jobs at the airport.
      - label: When
        text: "2017"
    sources: &a1
      - s-g10-changi-cleaning-robots-1
