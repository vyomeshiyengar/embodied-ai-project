types:
  - id: t-autonomous-mobile-robots
    name: Autonomous mobile robots
    zone: street
    where: On construction sites
    how: They have the ability to navigate complex environments. They create a digital map of the work space with a process called Simultaneous Localization and mapping. It uses its sensors to determine process location within the map. The algorithm will figure out the best path to take and this ability is powered by advanced sensors, AI and real time data. It is able to pick things up and surrey and load. Manually moving items, loading them could be dangerous so this saves time for the construction workers. Project could be done at a much faster pace
    uses: They are used to carry, load, survey materials throughout the construction site. Manually this is usually dangerous and time-consuming surveying.
    running_in: null
    city_response: null
    progression: null
    sources: []
  - id: t-robotic-arms-and-exoskeletons
    name: Robotic Arms and Exoskeletons
    zone: street
    where: Construction sites
    how: A robotic exoskeleton, controlled by a trained human operator, can move heavy rubble. It can deliver the ability to do repetitive operations over long periods of time without tiring. Operating heavy portable tools or equipment, for example, can be done for much longer periods, It can also support back for carrying and sustained forward flexion; shoulder and arm support for overhead drilling, fastening and panel installation; and lower and limb support for prolonged stopping or sit-stand assistance.
    uses: Robotic arms are used to help workers lift and balance heavy tools needed and exoskeletons help prevent workers from injuries and fatigue from repetitive strain or overexertion.
    running_in: null
    city_response: null
    progression: null
    sources: []
  - id: t-drones-and-uavs
    name: Drones and UAVs
    zone: air
    where: Construction sites
    how: They use Cameras, plus LIDARs.. The data gets processed into stitched aerial maps, 3D models, terrain maps and cut-and-fill volume calculations. parsons Software compares what the drone captured against plans or earlier flights. The drone flies the site and captures images, usually along set routes. It doesn't build or repair anything.It reaches places that are risky or costly for people. Cities use drones for surveying, bridge inspections, water main repairs and roadway construction, mainly because they save time, money and manpower.
    uses: They are used to fulfill monitoring and inspection tasks and have a capability to operate at different heights. They also are able to navigate challenging terrains and access remote locations. With the use of Drones and UAV’s workers are able to minimize reliance on heavy machinery, such as cranes.
    running_in: null
    city_response: null
    progression: null
    sources:
      - s-parsons-com-drones
  - id: t-3d-printing-robots
    name: 3D Printing Robots
    zone: street
    where: Public works, construction
    how: The robots track their position against a digital plan. In multi-robot printing, a computer-designed map assigns printing sections to each robot, and precise location positioning makes sure the joints between parts overlap. The machine follows the digital model of the structure, working out where each layer goes. It's more like following a plan than reacting to surprises.The machine sits on a real site, and it needs specially designed concrete because traditional concrete mixes jam and damage the printer. Cities have started using it.
    uses: It can be used for printing concrete, attaching welders or stack bricks and rebar. It makes many tedious tasks more automated.
    running_in: null
    city_response: null
    progression: null
    sources: []
