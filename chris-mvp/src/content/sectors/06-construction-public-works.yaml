regulations:
  rules:
    - id: g-building-codes-and-permits-3d-printing-b
      name: Building codes and permits (3D printing)
      area: Building codes and permits (3D printing)
      level: city
      level_label: Local building officials
      status: in_force
      covers: A new standard, ICC 1150, was approved in July 2026. It sets rules for the materials, inspection and design of 3D printed walls. Before that, builders had to use a special approval route because 3D printing was not in the building code.
      falls_short: It covers the wall, not worker safety around the printer. Cities also have to adopt it, because local governments adopt and enforce building codes.
      sources: []
    - id: g-workplace-safety-assembly-demolition-hea
      name: Workplace safety (assembly, demolition, heavy equipment)
      area: Workplace safety (assembly, demolition, heavy equipment)
      level: federal
      level_label: Federal (OSHA)
      status: in_force
      covers: OSHA has no specific standards for robotics. It uses general rules like machine safeguarding and lockout/tagout. ANSI and ISO standards act as guidance and are voluntary unless OSHA adopts them.
      falls_short: ISO 10218 does not apply to non-industrial robots, including remote-controlled ones, so demolition robots may be left out. Most standards were written for factories, not open job sites.
      sources: []
    - id: g-drones-drones
      name: Drones
      area: Drones
      level: federal
      level_label: Federal (FAA)
      status: in_force
      covers: Under Part 107, you need a remote pilot certificate or be supervised by someone who has one. Flights beyond the pilot's sight generally need case-by-case waivers.
      falls_short: The rule meant to replace waivers (Part 108) was under White House review, with no publication date announced as of September 2026. The FAA rules cover airspace, not a drone distracting a worker on a site.
      sources: []
