overview:
  summary: "Currently, physical AI has already begun to show up in parks, mostly as maintenance robots and drones. The governance questions that are important happen in three instances: where a robot or drone takes on work staff used to do (mowing, inspection, lifeguarding), where it watches the public (patrol robots, police drones), and where it shares space with wildlife and visitors who never agreed to it."
