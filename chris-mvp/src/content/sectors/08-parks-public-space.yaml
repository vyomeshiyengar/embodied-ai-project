regulations:
  rules:
    - id: g-faa-airspace-rules-part-107-now-part-108
      name: FAA airspace rules (Part 107 now; Part 108 BVLOS pending)
      level: federal
      level_label: Federal
      status: pending
      covers: Who may fly, where, how high, beyond line of sight
      falls_short: Cities can regulate only takeoff and landing on public land, not flight paths or noise
      sources: []
    - id: g-nps-policy-memorandum-14-05-2014
      name: NPS Policy Memorandum 14-05 (2014)
      level: federal
      level_label: Federal (national parks only)
      status: in_force
      covers: Bans launching, landing or operating drones in national parks; violations are a misdemeanor, up to 6 months in jail and a $5,000 fine
      falls_short: Prompted by noise complaints and wildlife harassment. Doesn't reach city parks; agency drones still allowed with approval
      sources: []
    - id: g-city-park-rules-and-takeoff-landing-perm
      name: City park rules & takeoff/landing permits (e.g., NYC Rules Title 38, Ch. 24, July 2023)
      level: city
      level_label: City
      status: in_force
      covers: NYC requires a permit, insurance and FAA documents for most drone takeoffs; crashes must be reported to NYPD
      falls_short: Written for the public's drones; ground robots and city-owned fleets mostly unaddressed
      sources: []
    - id: g-surveillance-technology-ordinances-e-g-b
      name: Surveillance-technology ordinances (e.g., Berkeley Municipal Code §2.99)
      level: city
      level_label: City
      status: in_force
      covers: Council approval, community input and civilian oversight before police acquire drones or similar tech
      falls_short: Often limited to police; a parks department's camera-equipped mower or patrol robot can fall outside
      sources: []
    - id: g-fourth-amendment-and-state-constitutiona
      name: Fourth Amendment & state constitutional privacy (e.g., Calif. Art. I §1)
      level: federal
      level_label: Federal / State
      status: in_force
      covers: Limits on government searches
      falls_short: Low expectation of privacy in public parks; little limit on mobile cameras or data retention. Chula Vista, CA lost a records lawsuit over its drone video in 2025
      sources: []
    - id: g-ada-title-ii
      name: ADA Title II
      level: federal
      level_label: Federal
      status: in_force
      covers: Accessible public programs and facilities, including park paths
      falls_short: No standard for robots blocking accessible routes or for accessible robot interfaces (buttons, voice-only prompts)
      sources: []
    - id: g-wildlife-law-esa-migratory-bird-treaty-a
      name: Wildlife law (ESA, Migratory Bird Treaty Act, state wildlife codes)
      level: federal
      level_label: Federal / State
      status: in_force
      covers: Harming protected species
      falls_short: Applies after harm; no pre-deployment wildlife safety test (the Oxford hedgehog test is voluntary)
      sources: []
    - id: g-local-noise-ordinances
      name: Local noise ordinances
      level: city
      level_label: City
      status: in_force
      covers: Limits on loud equipment by hour
      falls_short: Quiet electric machines escape limits and can run at night, when wildlife is active (Germany allows robot mowers at night and on Sundays)
      sources: []
    - id: g-product-safety-standards-for-mowers-and
      name: Product safety standards for mowers and machinery (CPSC, UL/EN standards)
      level: federal
      level_label: Federal / industry
      status: in_force
      covers: Blade guards, stop functions
      falls_short: Tested against people and objects, not small animals; humanoids and patrol robots have no public-space standard
      sources: []
    - id: g-public-procurement-law-and-contracts
      name: Public procurement law & contracts
      level: city
      level_label: City / State
      status: in_force
      covers: Bidding, leases, service agreements
      falls_short: The key lever, but contracts rarely include labor provisions, evaluation standards or data terms. NYC kept paying for its K5 while it sat unused
      sources: []
    - id: g-public-sector-labor-law-civil-service-un
      name: Public-sector labor law, civil service, union contracts
      level: city
      level_label: State / City
      status: in_force
      covers: Contracting-out limits, job classifications
      falls_short: '"Robot-as-a-service" leases may count as contracting out; few contracts define it'
      sources: []
    - id: g-tort-law-and-sovereign-immunity
      name: Tort law & sovereign immunity
      level: state
      level_label: State
      status: in_force
      covers: Injury claims against cities and vendors
      falls_short: Municipal immunity caps; unclear who pays when a leased robot injures a visitor
      sources: []
  gaps:
    - "Rules for the city's own drones over parks: NPS restricts drones in national parks, but most city parks have no equivalent for city-operated or DFR drones."
    - "Pre-deployment wildlife testing: there's no requirement to test mowers, drones or ground robots against wildlife before use."
    - "Human-contact edge cases: there's no required testing for robots that could touch people, including rare cases (a child reaching out, a crowd surge)."
    - 'Working emergency features: nothing requires a "help" button to actually reach help before a robot is deployed.'
    - "Noise standards for quiet, always-on machines: nothing sets when they may run, including at night."
    - "Accessibility: there are no requirements for robots on paths or for their interfaces."
    - "Data retention limits: nothing caps how long park robots and drones keep video, audio and location data."
    - "Evaluation and labor metrics in contracts: there's no standard for what success means, how it's measured, and what happens to the work and workers it changes."
case_studies:
  - id: c-g08-singapore-spot-park
    title: Robot dog reminds park visitors to keep their distance
    place: Bishan-Ang Mo Kio Park, Singapore
    kind: international
    pittsburgh: false
    pin_id: p-g08-singapore-spot-park
    fields:
      - label: What happened
        text: For two weeks from May 8, 2020, Spot walked a 3 km stretch of Bishan-Ang Mo Kio Park playing a recorded safe-distancing message and counting visitors with video analytics.
      - label: Response
        text: The government said the robot was not for enforcement and was meant to reduce patrol staff and contact.
      - label: When
        text: 2020-05
    sources: &a1
      - s-g08-singapore-spot-park-1
