regulations:
  rules:
    - id: g-drone-aviation-us-faa-part-107-small-uas
      name: FAA Part 107 (small UAS rules); waivers for night and beyond-visual-line-of-sight flights; proposed BVLOS rule (Part 108)
      area: Drone aviation (US)
      level: federal
      level_label: Federal (FAA); cities cannot generally regulate airspace but can control city-owned launch and landing sites
      status: proposed
      covers: Pilot certification, altitude, flying over people, airspace permissions
      falls_short: BVLOS and flights over people still need waivers; not designed for repeated autonomous fleets; pending rule status should be checked
      sources: []
    - id: g-drone-aviation-eu-uk-eu-regulation-2019
      name: EU Regulation 2019/947 and 2019/945 (open, specific, certified categories); UK CAA UAS rules
      area: Drone aviation (EU/UK)
      level: international
      level_label: EU and national aviation authorities
      status: in_force
      covers: Operator registration, risk assessment, Remote ID class markings
      falls_short: Heavy paperwork for routine inspection; national differences
      sources: []
    - id: g-drones-in-other-regions-transport-canada
      name: Transport Canada CARs Part IX; Japan's Civil Aeronautics Act (Level 4 flights from 2022); China's UAV flight management rules (2024); Singapore Air Navigation Act
      area: Drones in other regions
      level: international
      level_label: National
      status: in_force
      covers: Registration, flight zones, operator rules
      falls_short: Rules differ and change quickly
      sources: []
    - id: g-bridge-and-asset-inspection-us-national
      name: US National Bridge Inspection Standards (23 CFR 650 subpart C) and FHWA guidance; Japan's five-year close-inspection rule
      area: Bridge and asset inspection
      level: federal
      level_label: Federal/national with state or local owners
      status: in_force
      covers: Who must inspect, how often, qualifications
      falls_short: Allow tools in principle but do not set robot data-quality or AI validation standards
      sources: []
    - id: g-pipeline-and-gas-safety-phmsa-49-cfr-par
      name: PHMSA 49 CFR Parts 192 and 195; EU ATEX rules for explosive atmospheres
      area: Pipeline and gas safety
      level: federal
      level_label: Federal (PHMSA) with state regulators
      status: in_force
      covers: Operation and testing of pipelines, equipment in hazardous areas
      falls_short: Not written for in-pipe robots doing repairs
      sources: []
    - id: g-workplace-safety-osha-confined-space-rul
      name: OSHA confined-space rule (29 CFR 1910.146) and general duty clause; UK Confined Spaces Regulations 1997 and Health and Safety at Work Act; EU Machinery Regulation (EU) 2023/1230 (applies from 2027)
      area: Workplace safety
      level: federal
      level_label: Federal (OSHA) and state plans; EU and national
      status: in_force
      covers: Worker entry, equipment safety, machine design
      falls_short: Do not cover human-robot teamwork or algorithm-driven work pace in detail
      sources: []
    - id: g-product-liability-and-insurance-state-pr
      name: State product-liability law; EU Product Liability Directive (revised); insurance requirements for drone operators
      area: Product liability and insurance
      level: state
      level_label: State / national
      status: in_force
      covers: Who pays when a robot causes harm
      falls_short: Unclear split between manufacturer, software provider, city and contractor
      sources: []
    - id: g-privacy-and-surveillance-state-drone-pri
      name: State drone-privacy laws (e.g., Texas Government Code ch. 423, Florida's Freedom from Unwarranted Surveillance Act); state privacy statutes (CCPA); GDPR; UK data protection law
      area: Privacy and surveillance
      level: state
      level_label: State/national
      status: in_force
      covers: Images of people and private property, retention and sharing
      falls_short: Inspection images of buildings are often 'incidental data'; weak rules on retention and secondary police use
      sources: []
    - id: g-local-rules-nyc-admin-code-restrictions
      name: NYC Admin Code restrictions on aircraft take-off and landing; permits for sidewalk and street work; zoning
      area: Local rules
      level: city
      level_label: City
      status: in_force
      covers: Where robots can launch, land or work
      falls_short: Patchwork; cities lack authority over airspace
      sources: []
    - id: g-critical-infrastructure-and-cyber-nis2-e
      name: NIS2 (EU), CISA guidance and TSA pipeline security directives (US), national drone-bans near critical sites
      area: Critical-infrastructure and cyber
      level: federal
      level_label: Federal/national
      status: in_force
      covers: Security duties for operators, protection of sensitive sites
      falls_short: Seldom mention inspection robots or robot supply chains
      sources: []
    - id: g-ai-law-eu-ai-act-high-risk-status-if-rob
      name: EU AI Act (high-risk status if robot is a safety component of regulated machinery); US sector-regulator and state-law approach; China's layered rules
      area: AI law
      level: federal
      level_label: EU/national; federal and state in the US
      status: in_force
      covers: Risk management, transparency, human oversight
      falls_short: Most inspection robots are not clearly classed; timelines for high-risk rules have been shifting
      sources: []
    - id: g-accessibility-ada-and-equivalent-laws
      name: ADA and equivalent laws
      area: Accessibility
      level: federal
      level_label: Federal, state, city
      status: in_force
      covers: Sidewalk and facility access
      falls_short: No guidance on robots obstructing accessible routes
      sources: []
  gaps:
    - Validation standards for AI defect detection, and who is responsible for a missed defect.
    - Rules for autonomous repair robots operating on live utilities or in public streets.
    - Privacy limits and retention rules for incidental images of people and homes.
    - Coordination of many robots and drones in the same area, including disaster situations.
    - Cyber-security requirements for robot fleets and vendor update processes.
    - Worker protections when robots change jobs, and liability for human-robot teams.
