overview:
  summary: Inspection is one of the most developed use of embodied AI in city infrastructure.
  points:
    - Drones are widely used and often routine for bridges, façades, towers and power lines.
    - Pipe and sewer crawlers have been commercial for decades--AI is now used to read footage.
    - Legged robots, climbing robots and underwater vehicles are in pilots and early deployment.
    - Robots that repair things (pothole filling, crack sealing, façade cleaning, live-gas-main repair) are earlier stage, mostly pilots and niche commercial products.
    - Fully autonomous, citywide inspection fleets do not yet exist--most systems still have a human pilot or reviewer.
  why_it_matters: Many cities have ageing infrastructure, tight budgets and a shortage of inspectors. Robots replace dangerous work (confined spaces, heights, live roads), make inspections cheaper and more frequent, and produce data that supports predictive maintenance. They also bring new things onto streets and into the air, create large data sets (images of private property), and make the city dependent on software, vendors and networks.
  core_shift: null
