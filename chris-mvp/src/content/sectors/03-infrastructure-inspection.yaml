terms:
  - term: UAS / UAV / RPAS
    definition: unmanned aircraft system, unmanned aerial vehicle, remotely piloted aircraft system. Three names for drones, used by different regulators.
    sources: []
  - term: ROV
    definition: "remotely operated vehicle (underwater, tethered, human-driven). AUV: autonomous underwater vehicle (untethered, runs a mission by itself)."
    sources: []
  - term: Crawler
    definition: a wheeled or tracked robot that travels inside a pipe or along a surface.
    sources: []
  - term: Tethered drone
    definition: a drone attached by cable for power or safety.
    sources: []
  - term: Drone-in-a-box
    definition: a drone that lives in a weatherproof station, launches and recharges without a person on site.
    sources: []
  - term: Legged robot
    definition: a walking robot (for example Spot) able to handle stairs and rough ground.
    sources: []
  - term: VLOS
    definition: "visual line of sight; the pilot can see the drone. BVLOS: beyond visual line of sight; the key legal step for routine autonomous inspection."
    sources: []
  - term: Remote ID
    definition: a broadcast 'digital licence plate' for drones.
    sources: []
  - term: Geofence
    definition: a software boundary that stops a robot entering an area.
    sources: []
  - term: UTM
    definition: unmanned traffic management; software to coordinate many drones.
    sources: []
  - term: Teleoperation
    definition: "a human controls the robot remotely. Human-in-the-loop: a person approves key decisions. Human-on-the-loop: a person monitors and can intervene."
    sources: []
  - term: Autonomy level
    definition: a scale from fully manual to fully automatic mission execution.
    sources: []
  - term: LiDAR
    definition: laser scanning that builds a 3D point cloud.
    sources: []
  - term: SLAM
    definition: simultaneous localisation and mapping; how a robot builds a map and finds itself where GPS does not work.
    sources: []
  - term: Photogrammetry
    definition: building 3D models from overlapping photos.
    sources: []
  - term: Thermography / infrared
    definition: heat imaging used to find leaks, delamination and electrical faults.
    sources: []
  - term: GPR
    definition: ground-penetrating radar for what is under a surface.
    sources: []
  - term: NDT / NDE
    definition: non-destructive testing or evaluation (ultrasonic, magnetic, eddy-current methods) that checks condition without damaging the asset.
    sources: []
  - term: Computer vision / defect detection
    definition: AI that classifies cracks, corrosion, spalling, root intrusion and so on.
    sources: []
  - term: Edge AI
    definition: processing on the robot itself rather than in the cloud.
    sources: []
  - term: Anomaly detection
    definition: finding patterns that differ from normal without being told exactly what to look for.
    sources: []
  - term: Digital twin
    definition: a live digital copy of an asset updated by robot data.
    sources: []
  - term: SHM
    definition: structural health monitoring, combining permanent sensors and robot scans.
    sources: []
  - term: Predictive / condition-based maintenance
    definition: repairing when data says a failure is coming, rather than on a fixed schedule.
    sources: []
  - term: ILI
    definition: in-line inspection; tools that travel inside a pipeline.
    sources: []
  - term: BIM
    definition: building information modelling; the digital model of a building or structure.
    sources: []
  - term: CCTV / NASSCO coding
    definition: standard way to label sewer defects, which AI is being trained to apply.
    sources: []
  - term: Part 107 / specific category / certified category
    definition: US and EU drone regulatory classes.
    sources: []
  - term: Waiver / exemption
    definition: permission to go beyond standard rules.
    sources: []
  - term: Critical infrastructure
    definition: assets whose failure would badly hurt society (energy, water, transport); a trigger for tighter security.
    sources: []
  - term: Incidental data
    definition: information captured by accident, such as people in an inspection photo.
    sources: []
  - term: Dual use
    definition: technology that can serve both civilian and hostile purposes.
    sources: []
  - term: Black swan
    definition: a rare, severe event that is hard to predict.
    sources: []
